<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: rgb(216, 216, 216);
        padding: 50px;
        font-family: "Bradley Hand", cursive;
      }

      .container {
        width: 600px;
        background-color: white;
        margin: 20px auto;
        border-radius: 10px;
        padding: 30px 50px 60px 50px;
        position: relative;
      }

      .title {
        text-align: center;
        font-weight: bold;
        font-size: 20px;
        color: rgb(111, 119, 131);
        margin-bottom: 30px;
      }

      .track {
        position: relative;
        width: 100%;
        height: 8px;
        background: #3b3848;
        border-radius: 4px;
        cursor: pointer;
      }

      .circle {
        position: absolute;
        width: 24px;
        height: 24px;
        background-color: rgb(195, 195, 201);
        box-shadow: 2px 4px 5px rgba(0, 0, 0, 0.2);
        border-radius: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        cursor: pointer;
        z-index: 10;
      }

      .dot {
        position: absolute;
        width: 4px;
        height: 4px;
        background: white;
        border-radius: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      .mark {
        position: absolute;
        top: 20px;
        transform: translateX(-50%);
        color: #666;
        font-size: 14px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container" id="brightness">
      <div class="title">Яркость: <span id="val-brightness">0%</span></div>
      <div class="track"><div class="circle"></div></div>
    </div>

    <div class="container" id="volume">
      <div class="title">Громкость: <span id="val-volume">0%</span></div>
      <div class="track"><div class="circle"></div></div>
    </div>

    <script>
      // Яркость

      const brightContainer = document.getElementById("brightness");
      const brightTrack = brightContainer.querySelector(".track");
      const brightCircle = brightContainer.querySelector(".circle");
      const brightDisplay = document.getElementById("val-brightness");

      function moveBrightness(clientX, shiftX = 0) {
        const trackArea = brightTrack.getBoundingClientRect();
        // Получаем координаты дорожки
        let offsetX = clientX - trackArea.left + shiftX; //положение мыши

        if (offsetX < 0) offsetX = 0;
        if (offsetX > trackArea.width) offsetX = trackArea.width;
        //ограничители с двух сторон

        let percent = (offsetX / trackArea.width) * 100;
        brightCircle.style.left = offsetX + "px";
        brightDisplay.textContent = Math.round(percent) + "%";
      }

      brightCircle.onmousedown = (e) => {
        e.preventDefault();
        const circleRect = brightCircle.getBoundingClientRect();
        const trackRect = brightTrack.getBoundingClientRect();
        const currentCenter =
          circleRect.left + circleRect.width / 2 - trackRect.left;
        const shiftX = currentCenter - (e.clientX - trackRect.left);

        const onMouseMove = (e) => moveBrightness(e.clientX, shiftX);
        const onMouseUp = () => {
          document.removeEventListener("mousemove", onMouseMove);
          document.removeEventListener("mouseup", onMouseUp);
        };
        document.addEventListener("mousemove", onMouseMove);
        document.addEventListener("mouseup", onMouseUp);
      };

      brightTrack.onclick = (e) => {
        if (e.target !== brightCircle) moveBrightness(e.clientX, 0);
      };

      // Громквость

      const volumeContainer = document.getElementById("volume");
      const volumeTrack = volumeContainer.querySelector(".track");
      const volumeCircle = volumeContainer.querySelector(".circle");
      const volumeDisplay = document.getElementById("val-volume");
      const volumeSteps = [0, 20, 40, 60, 80, 100];

      // шкала для громкости + точки-маркеры на ней
      volumeSteps.forEach((percent) => {
        const dot = document.createElement("div");
        dot.className = "dot";
        dot.style.left = percent + "%";
        volumeTrack.appendChild(dot);

        const label = document.createElement("div");
        label.className = "mark";
        label.style.left = percent + "%";
        label.textContent = percent;
        volumeTrack.appendChild(label);
      });

      // движение
      function moveVolume(clientX, shiftX = 0) {
        const trackArea = volumeTrack.getBoundingClientRect();
        let offsetX = clientX - trackArea.left + shiftX; //trackArea.left - начало дорожки, clientX - нахождение мыши shiftX - смещение

        if (offsetX < 0) offsetX = 0;
        if (offsetX > trackArea.width) offsetX = trackArea.width;

        let percent = (offsetX / trackArea.width) * 100;
        volumeCircle.style.left = offsetX + "px";
        volumeDisplay.textContent = Math.round(percent) + "%";
      }

      // захват мыши

      volumeCircle.onmousedown = (e) => {
        e.preventDefault(); // Запрет для браузера выделять или тащить картинку
        const circleRect = volumeCircle.getBoundingClientRect();
        const trackRect = volumeTrack.getBoundingClientRect();

        // Считаем расстояние от клика до центра шарика
        const currentCenter =
          circleRect.left + circleRect.width / 2 - trackRect.left;
        const shiftX = currentCenter - (e.clientX - trackRect.left);

        const onMouseMove = (ev) => moveVolume(ev.clientX, shiftX);
        const onMouseUp = () => {
          // перестаем следить за движением когда отпускаем
          document.removeEventListener("mousemove", onMouseMove);
          document.removeEventListener("mouseup", onMouseUp);
        };
        document.addEventListener("mousemove", onMouseMove);
        document.addEventListener("mouseup", onMouseUp);
      };

      volumeTrack.onclick = (e) => {
        if (e.target !== volumeCircle) moveVolume(e.clientX, 0);
      };
      // начальное нулевое положение
      moveBrightness(brightTrack.getBoundingClientRect().left);
      moveVolume(volumeTrack.getBoundingClientRect().left);
    </script>
  </body>
</html>
